<body><main><h1>耄耋格式</h1><p>在 Mac 本机处理图片、音视频、Office、PDF、OCR 和压缩文件。</p><p>当前为 macOS 14+ / Apple Silicon 源码预览版。需要另外安装转换引擎和 LibreOffice，安装方式见仓库 README。</p><p>原名 VERT Enhanced，基于 Sikander RAVATE 的 VERT Desktop 扩展，遵循 AGPL-3.0 许可。</p><p>尚未提供经过干净机器验收、Apple 开发者签名及公证的正式安装包。</p></main></body></html>
