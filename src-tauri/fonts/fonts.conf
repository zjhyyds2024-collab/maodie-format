<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Headless LibreOffice must see macOS fonts, including CJK fallbacks. -->
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir>~/Library/Caches/vert-enhanced/fontconfig</cachedir>
  <config><rescan><int>30</int></rescan></config>
</fontconfig>
